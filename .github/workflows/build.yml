name: Build

# What runs where (see docs/Build-Deploy-System.md):
#   pull request        one platform (windows), so a commit gets fast feedback
#   develop / main / releases/**   all four platforms
#   nightly, manual, or a PR labelled "ci: full-matrix"   all four platforms
# `push` is limited to the long-lived branches: a branch with an open PR would otherwise
# build twice for every commit.
on:
  push:
    branches:
      - develop
      - main
      - 'releases/**'
    paths-ignore:
    - 'README.md'
    - 'docs/**'
  pull_request:
    paths-ignore:
    - 'README.md'
    - 'docs/**'
  schedule:
    # 03:17 UTC, every day: the full matrix on the default branch
    - cron: '17 3 * * *'
  workflow_dispatch:

# One run per branch or pull request; pushing again cancels the superseded run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which platforms this run uses. `include` cannot be filtered (an include whose key does
  # not match an existing combination adds a job), so the whole matrix is built here.
  setup:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          FULL: "${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci: full-matrix') }}"
        run: |
          windows='{"os":"windows-latest","run-build":".\\build.cmd","run-tests":".\\runTests.cmd"}'
          ubuntu='{"os":"ubuntu-latest","run-build":"sh ./build.sh","run-tests":"bash ./runTests.sh"}'
          mac_x64='{"os":"macos-15-intel","run-build":"bash ./build.sh","run-tests":"bash ./runTests.sh"}'
          mac_arm='{"os":"macos-15","run-build":"bash ./build.sh","run-tests":"bash ./runTests.sh"}'
          if [ "$FULL" = "true" ]; then
            echo "matrix={\"include\":[$ubuntu,$windows,$mac_x64,$mac_arm]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$windows]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Paket
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            paket-files
          key: ${{ runner.os }}-paket-${{ hashFiles('paket.lock') }}
          restore-keys: |
            ${{ runner.os }}-paket-

      - name: Build
        run: ${{ matrix.run-build }}

      # kernel-independent tests (HERA tests skip themselves via --skip-hera).
      # The kernel-backed ones run in the spice-tests job below.
      - name: Test
        run: ${{ matrix.run-tests }}

  # The HERA SPICE tests, which need ~1.3 GB of ESA mission kernels. Linux only, on
  # purpose: kernels are platform-independent data files, and one cache entry of that
  # size per OS would crowd the paket caches out of the repository's 10 GB budget.
  spice-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Paket
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            paket-files
          key: ${{ runner.os }}-paket-${{ hashFiles('paket.lock') }}
          restore-keys: |
            ${{ runner.os }}-paket-

      # Keyed on the pins, not on anything ESA controls: publishing a new SKD (which
      # happens every few weeks) must not invalidate this, and bumping a pin must.
      # restore-keys hands a pin bump the previous tree, so it refetches one changed
      # meta-kernel closure instead of all four.
      - name: Cache SPICE kernels
        uses: actions/cache@v6
        with:
          path: spice
          key: ${{ runner.os }}-spice-${{ hashFiles('scripts/spice-kernels.pins') }}
          restore-keys: |
            ${{ runner.os }}-spice-

      # Runs on a cache hit too: it verifies the restored tree offline against its own
      # manifest and exits in a second when complete, and repairs a partial restore
      # instead of letting it fail much later inside CSPICE.
      - name: Fetch SPICE kernels
        run: bash scripts/fetch-spice-kernels.sh spice

      - name: Build
        run: sh ./build.sh

      # Everything, including the HERA tests. Tests needing private data or a GL
      # context still skip themselves here.
      - name: Test
        env:
          PRO3D_SPICE_KERNELS: ${{ github.workspace }}/spice
        run: bash ./runAllTests.sh
