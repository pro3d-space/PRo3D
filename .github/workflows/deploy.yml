name: Deploy
on:
  push: 
    paths:
      - PRODUCT_RELEASE_NOTES.md
      - aardium/package.json
      - .github/workflows/deploy.yml 
jobs:

  win32_x64:
      name: windows
      runs-on: windows-latest
      steps:  
        - name: Install Dotnet
          uses: actions/setup-dotnet@v1
          with:
            dotnet-version: '8.0.x'
        - name: Checkout
          uses: actions/checkout@v4
        #- name: Yarn Install
        #  working-directory: aardium
        #  run: yarn install  
        - name: Enable Corepack
          run: corepack enable
        - name: Set Yarn version
          working-directory: aardium
          run: corepack prepare yarn@4.10.3 --activate
        - name: Activate latest Yarn
          run: yarn set version 4.10.3
        - name: Verify
          run: yarn --version
        - name: Setup Node.js with specific npm
          uses: actions/setup-node@v4
          with:
            node-version: '20' 
        - name: Verify node
          working-directory: aardium
          run: npm --version
        #- name: Install specific npm version
        #  working-directory: aardium
        #  run: |
        #    npm install -g npm@20.11.1
        #    npm --version
        - name: Create ZIP Release
          env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: .\build.cmd GitHubRelease
        - name: Build
          env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: .\build.cmd PublishToElectron


  mac_x64:
    name: OSX (x64)
    runs-on: macos-13
    needs: win32_x64
    steps:  
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 8.0.x
      - name: Add Cert to Keychain
        uses: apple-actions/import-codesign-certs@v1
        with: 
          p12-file-base64: ${{ secrets.MAC_CERT_BASE64 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}
      - name: Yarn Install
        working-directory: aardium
        run: yarn install
      - name: Build
        run: bash ./build.sh PublishToElectron
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_DEV_PASSWORD: ${{ secrets.MAC_DEV_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_IDENTITY: ${{ secrets.MAC_IDENTITY }} 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  
  linux_x64:
    name: linux 
    runs-on: ubuntu-latest
    needs: win32_x64
    steps:  
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v1
      - name: Install Dotnet
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'
      - name: Checkout
        uses: actions/checkout@v2
      - name: Yarn Install
        working-directory: aardium
        run: yarn install
      - name: Build
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./build.sh PublishToElectron
